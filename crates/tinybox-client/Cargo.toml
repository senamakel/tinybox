[package]
name = "tinybox-client"
description = "Typed TinyBus host client for the TinyBox module."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tinybox-bus.workspace = true
tinybus = { path = "../../vendor/tinybus/crates/tinybus", version = ">=0.1.8, <0.2", default-features = false }

[dev-dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tinybus = { path = "../../vendor/tinybus/crates/tinybus", version = ">=0.1.8, <0.2", default-features = false, features = ["macros", "modules"] }
tinybus-module = { path = "../../vendor/tinybus/crates/tinybus-module", version = ">=0.1.8, <0.2", features = ["static-link"] }
tinybus-module = { path = "../../vendor/tinybus/crates/tinybus-module", version = ">=0.1.8, <0.2", features = ["static-link"] }

[lints]
workspace = true
