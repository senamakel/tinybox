[package]
name = "tinybox-drivers"
description = "tinybox on the tinystoragedrivers ports: box records and the jail index as documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: it depends on `tinystoragedrivers-core` by git tag, which a
# crates.io package cannot do. The published crates stay free of any storage
# dependency.
publish = false

[dependencies]
tinybox-bus.workspace = true
tinybox-core.workspace = true
tinybox-jail.workspace = true
tinystoragedrivers-core = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
log = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }

[lints]
workspace = true
