[package]
name = "tinybox-bus"
description = "Serializable TinyBox module contract without a runtime or backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
# The module's storage requirements are data-only contract types; the host owns
# the storage backend and enforces any grants derived from this declaration.
tinystoragedrivers-bus.workspace = true

[features]
default = []
# Kept as an empty compatibility feature; storage schema execution belongs to
# tinybox-drivers, while the bus carries only storage names and needs.
storage = []

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
