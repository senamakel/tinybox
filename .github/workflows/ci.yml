name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@4adc1080fb495098e7af1aade82ed7e6e3c69bb7
    with:
      coverage-script: scripts/check-coverage.sh
      module-e2e-script: scripts/test-e2e.sh
      feature-test-script: scripts/test-features.sh
      apt-packages: bubblewrap
  linux-2204:
    name: Linux E2E and feature tests (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Run module E2E verification
        run: scripts/test-e2e.sh
      - name: Run required Linux sandbox and feature tests
        env:
          TINYBOX_REQUIRE_BWRAP: "1"
        run: scripts/test-features.sh
  native-resource-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Install rootless native jail prerequisites
        run: |
          source scripts/ci/prepare-rootless-native-resources.sh
      - name: Run required Linux native resource proofs
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          runtime_dir="/run/user/${uid}"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          TINYBOX_REQUIRE_NATIVE_RESOURCE_TESTS=1 cargo test -j1 -p tinybox-module native_
          TINYBOX_REQUIRE_NATIVE_RESOURCE_TESTS=1 cargo test -j1 -p tinybox-module resource_aware_bus_exec_cancellation_reports_events_and_reaps_descendants
          TINYBOX_REQUIRE_NAMESPACE_RESOURCE_TESTS=1 TINYBOX_LIVE_NAMESPACES=1 cargo test -j1 -p tinybox-linux --test live_namespaces live_memory_limit_kills_a_child_that_touches_past_its_budget -- --nocapture
          TINYBOX_REQUIRE_NAMESPACE_RESOURCE_TESTS=1 TINYBOX_LIVE_NAMESPACES=1 cargo test -j1 -p tinybox-linux --test live_namespaces live_pids_limit_rejects_additional_child_processes -- --nocapture
