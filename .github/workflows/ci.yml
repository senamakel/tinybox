name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@4adc1080fb495098e7af1aade82ed7e6e3c69bb7
    with:
      coverage-script: scripts/check-coverage.sh
      module-e2e-script: scripts/test-e2e.sh
      feature-test-script: scripts/test-features.sh
      apt-packages: bubblewrap
  linux-2204:
    name: Linux E2E and feature tests (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run module E2E verification
        run: scripts/test-e2e.sh
      - name: Run required Linux sandbox and feature tests
        env:
          TINYBOX_REQUIRE_BWRAP: "1"
        run: scripts/test-features.sh
  macos-15:
    name: macOS E2E and feature tests (macOS 15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Require Seatbelt runtime
        run: test -x /usr/bin/sandbox-exec
      - name: Run module E2E verification
        run: scripts/test-e2e.sh
      - name: Run required macOS sandbox and feature tests
        env:
          TINYBOX_REQUIRE_SEATBELT_TESTS: "1"
        run: scripts/test-features.sh
  windows-11-arm:
    name: Windows 11 E2E and feature tests (ARM64)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Require Windows ARM64 runner
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64') {
            throw "Expected a Windows ARM64 runner, got '$env:RUNNER_ARCH'"
          }
      - name: Run module E2E verification
        shell: bash
        run: scripts/test-e2e.sh
      - name: Run Windows feature tests
        shell: bash
        run: scripts/test-features.sh
      - name: Run required ARM64 AppContainer acceptance tests
        shell: bash
        env:
          TINYBOX_REQUIRE_APPCONTAINER_RESOURCE_TESTS: "1"
        run: |
          set -euo pipefail
          tests=(
            windows::tests::appcontainer_backend_is_available_through_owned_process_supervision
            windows::tests::appcontainer_plan_check_keeps_cpu_unsupported_and_reports_job_limits
            windows::tests::appcontainer_owned_launch_captures_output_from_a_confined_child
            windows::tests::appcontainer_owned_termination_stops_descendants_after_parent_exit
            windows::tests::appcontainer_process_limit_enforces_maximum_child_count
            windows::tests::appcontainer_denies_reads_and_writes_outside_granted_roots
            windows::tests::appcontainer_denies_verbatim_path_reads_outside_granted_roots
            windows::tests::appcontainer_denies_parent_traversal_reads_outside_granted_roots
            windows::tests::appcontainer_child_cannot_connect_to_host_loopback
            windows::tests::live_appcontainer_memory_limit_blocks_over_budget_allocation
          )
          for test in "${tests[@]}"; do
            output="$(cargo test --locked -p tinybox-jail --lib "$test" -- --exact --nocapture --test-threads=1 2>&1)" || {
              printf '%s\n' "$output"
              exit 1
            }
            printf '%s\n' "$output"
            if ! grep -qE '1 passed; 0 failed' <<<"$output"; then
              echo "expected exactly one ARM64 AppContainer test to run: $test" >&2
              exit 1
            fi
          done
  windows-2025:
    name: Windows Server 2025 E2E and feature tests (x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Require Windows Server 2025 x64 runner
        shell: pwsh
        run: |
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          if ($os.Caption -notmatch 'Windows Server 2025' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Expected Windows Server 2025 x64, got '$($os.Caption)' / '$env:RUNNER_ARCH'"
          }
      - name: Run module E2E verification
        shell: bash
        run: scripts/test-e2e.sh
      - name: Run Windows feature tests
        shell: bash
        run: scripts/test-features.sh
  windows-appcontainer-tests:
    name: Windows AppContainer jail tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Require Windows Server 2025 x64 runner
        shell: pwsh
        run: |
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          if ($os.Caption -notmatch 'Windows Server 2025' -or $env:RUNNER_ARCH -ne 'X64') {
            throw "Expected Windows Server 2025 x64, got '$($os.Caption)' / '$env:RUNNER_ARCH'"
          }
      - name: Run focused AppContainer jail tests
        shell: bash
        run: |
          set -euo pipefail
          export TINYBOX_REQUIRE_APPCONTAINER_RESOURCE_TESTS=1
          tests=(
            windows::tests::appcontainer_backend_is_available_through_owned_process_supervision
            windows::tests::appcontainer_plan_check_keeps_cpu_unsupported_and_reports_job_limits
            windows::tests::appcontainer_profiles_are_unique_to_avoid_reusing_old_path_acl_grants
            windows::tests::appcontainer_drive_environment_uses_a_dos_path_for_verbatim_cwds
            windows::tests::appcontainer_local_app_data_must_be_present_and_absolute
            windows::tests::appcontainer_job_limits_map_memory_and_process_count_without_cpu_claims
            windows::tests::appcontainer_owned_launch_captures_output_from_a_confined_child
            windows::tests::appcontainer_owned_termination_stops_descendants_after_parent_exit
            windows::tests::appcontainer_untyped_owned_launch_does_not_inherit_the_host_environment
            windows::tests::appcontainer_denies_reads_and_writes_outside_granted_roots
            windows::tests::appcontainer_child_cannot_connect_to_host_loopback
            windows::tests::live_appcontainer_memory_limit_blocks_over_budget_allocation
          )
          for test in "${tests[@]}"; do
            cargo test --locked -p tinybox-jail --lib "$test" -- --exact --nocapture --test-threads=1
          done
  native-resource-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Install rootless native jail prerequisites
        run: |
          source scripts/ci/prepare-rootless-native-resources.sh
      - name: Run required Linux native resource proofs
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          runtime_dir="/run/user/${uid}"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          TINYBOX_REQUIRE_NATIVE_RESOURCE_TESTS=1 cargo test -j1 -p tinybox-module native_
          TINYBOX_REQUIRE_NATIVE_RESOURCE_TESTS=1 cargo test -j1 -p tinybox-module resource_aware_bus_exec_cancellation_reports_events_and_reaps_descendants
          TINYBOX_REQUIRE_NAMESPACE_RESOURCE_TESTS=1 TINYBOX_LIVE_NAMESPACES=1 cargo test -j1 -p tinybox-linux --test live_namespaces live_memory_limit_kills_a_child_that_touches_past_its_budget -- --nocapture
          TINYBOX_REQUIRE_NAMESPACE_RESOURCE_TESTS=1 TINYBOX_LIVE_NAMESPACES=1 cargo test -j1 -p tinybox-linux --test live_namespaces live_pids_limit_rejects_additional_child_processes -- --nocapture
  docker-network-live:
    name: Docker Egress and denied network connectivity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Require Docker daemon and default bridge gateway
        shell: bash
        run: |
          set -euo pipefail
          docker info --format 'Docker daemon ready: {{.ServerVersion}}'
          gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          test -n "$gateway"
          echo "Docker bridge gateway: $gateway"
      - name: Prove egress, allowlist, and default-Denied connectivity
        env:
          TINYBOX_LIVE_DOCKER: "1"
          TINYBOX_REQUIRE_LIVE_DOCKER: "1"
        run: |
          set -euo pipefail
          cargo test --locked -p tinybox-docker --test live_docker live_network_policy_controls_host_listener_connectivity -- --exact --nocapture --test-threads=1
          cargo test --locked -p tinybox-docker --test live_docker live_native_docker_dns_rebinding_stays_pinned -- --exact --nocapture --test-threads=1
